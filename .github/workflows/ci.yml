name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://tokentracker:tokentracker@localhost:5432/tokentracker?schema=public"
  TEST_DATABASE_URL: "postgresql://tokentracker:tokentracker@localhost:5432/tokentracker?schema=public"
  AUTH_SECRET: "ci-auth-secret-value-that-is-long-enough-000000000"
  CREDENTIAL_ENCRYPTION_KEY: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
  APP_URL: "http://localhost:3000"
  SESSION_COOKIE_SECURE: "false"
  ALLOW_REGISTRATION: "true"
  ENABLE_EXPERIMENTAL_ADAPTERS: "true"

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokentracker
          POSTGRES_PASSWORD: tokentracker
          POSTGRES_DB: tokentracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokentracker -d tokentracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration

  e2e:
    name: Playwright mobile flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tokentracker
          POSTGRES_PASSWORD: tokentracker
          POSTGRES_DB: tokentracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokentracker -d tokentracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
